<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sita 🎂</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d8c7ff, #c7efff);
        }

        .card {
            width: 90%;
            max-width: 600px;
            padding: 45px 25px;
            text-align: center;
            background: rgba(255,255,255,0.8);
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            animation: muncul 1.5s ease;
        }

        .cake {
            font-size: 80px;
            animation: goyang 1.5s infinite;
        }

        h1 {
            margin-top: 15px;
            font-size: 42px;
            color: #ff4f91;
        }

        h2 {
            margin-top: 10px;
            font-size: 28px;
            color: #7b4cff;
            animation: glow 2s infinite alternate;
        }

        p {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.7;
            color: #444;
        }

        button {
            margin-top: 25px;
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            background: #ff4f91;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            background: #ff2778;
        }

        .heart {
            position: absolute;
            font-size: 25px;
            animation: jatuh linear infinite;
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes goyang {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px #ff9bc0;
            }
            to {
                text-shadow: 0 0 20px #ff4f91;
            }
        }

        @keyframes jatuh {
            from {
                top: -50px;
                transform: rotate(0deg);
            }
            to {
                top: 110vh;
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="cake">🎂</div>

        <h1>Happy Birthday!</h1>

        <h2>Sita Septiani Azzahra 💖</h2>

        <p>
            Selamat ulang tahun, Sita! 🎉<br>
            Semoga hari ini menjadi hari yang spesial,
            penuh kebahagiaan, tawa, dan hal-hal baik.
            <br><br>
            Semoga semua impian dan harapanmu
            bisa tercapai satu per satu. ✨
        </p>

        <button onclick="ucapan()">
            🎁 Klik di sini
        </button>
    </div>

    <script>
        function ucapan() {
            alert(
                "🎉 HAPPY BIRTHDAY SITA SEPTIANI AZZAHRA! 🎉\n\n" +
                "Semoga panjang umur, sehat selalu,\n" +
                "semakin bahagia, dan semua keinginanmu\n" +
                "bisa tercapai! 💖🎂✨ impian nya jadi kemen reder"
            );

            buatConfetti();
        }

        function buatConfetti() {
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement("div");

                confetti.innerHTML = "🎉";
                confetti.style.position = "fixed";
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.top = "-30px";
                confetti.style.fontSize = (15 + Math.random() * 20) + "px";
                confetti.style.zIndex = "9999";
                confetti.style.transition =
                    "transform " + (2 + Math.random() * 3) + "s linear";

                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.style.transform =
                        "translateY(110vh) rotate(720deg)";
                }, 50);

                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        // Hati jatuh
        setInterval(() => {
            const heart = document.createElement("div");

            heart.className = "heart";
            heart.innerHTML = Math.random() > 0.5 ? "💖" : "💕";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (3 + Math.random() * 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }, 500);
    </script>

</body>
</html>
